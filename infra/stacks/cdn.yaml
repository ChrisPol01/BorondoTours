AWSTemplateFormatVersion: '2010-09-09'
Description: >
  BorondoTours — CDN Stack
  CloudFront distributions para frontend (SPA), media, y API proxy.

Parameters:
  Environment:
    Type: String
  FrontendBucketDomainName:
    Type: String
  ApiEndpoint:
    Type: String

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # --- OAC para S3 ---
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub borondo-${Environment}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --- CloudFront: Frontend (apps/web + apps/erp + apps/b2b) ---
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: !If [IsProd, PriceClass_All, PriceClass_100]
        Comment: !Sub BorondoTours Frontend (${Environment})

        Origins:
          - Id: S3Origin
            DomainName: !Ref FrontendBucketDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true

        # SPA fallback — rutas sin archivo devuelven index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

      Tags:
        - Key: Project
          Value: BorondoTours
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DistributionId:
    Value: !Ref FrontendDistribution
    Export:
      Name: !Sub ${AWS::StackName}-DistributionId

  DistributionDomainName:
    Value: !GetAtt FrontendDistribution.DomainName
    Export:
      Name: !Sub ${AWS::StackName}-DistributionDomain
