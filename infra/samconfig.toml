# SAM CLI Configuration — BorondoTours
# Docs: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html

version = 0.1

[default.global.parameters]
stack_name = "borondo-dev"

[default.build.parameters]
cached = true
parallel = true
use_container = false

[default.deploy.parameters]
stack_name = "borondo-dev"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"
parameter_overrides = "Environment=dev"
tags = "Project=BorondoTours Environment=dev"

[default.local_start_api.parameters]
warm_containers = "EAGER"
port = 3000

# === Staging ===
[staging.deploy.parameters]
stack_name = "borondo-staging"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"
parameter_overrides = "Environment=staging"
tags = "Project=BorondoTours Environment=staging"

# === Production ===
[prod.deploy.parameters]
stack_name = "borondo-prod"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"
parameter_overrides = "Environment=prod"
tags = "Project=BorondoTours Environment=prod"
s3_prefix = "borondo-prod"
