name: Deploy — Staging (obsoleto)

# NOTA: este workflow está obsoleto. Usa bun y Railway/Render, descartados por ADR-011.
# Por ahora el despliegue real del B2C es manual a S3 + CloudFront (ver docs/06-Operaciones/).
# Se conserva solo con disparo manual hasta definir el pipeline de despliegue (#13, #15).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

      - name: Deploy API to Railway / Render
        run: echo "Add your deploy command here (Railway / Render / Docker)"
        # Example for Railway:
        # run: railway up --service api
        # env:
        #   RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
