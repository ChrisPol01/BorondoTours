    when: vence el plazo del saldo
    then: ese participante pasa a FORFEITED, se cancela solo su cupo, su cuota de reserva figura como no reembolsable y sin Saldo a favor (RF-C06b); los otros 2 no se afectan y, como todos los vigentes (sin contar FORFEITED ni SLOT_RELEASED) estan en BALANCE_PAID, payment_status pasa a CONFIRMED por split_all_balances_paid y la reserva se mueve a Proximas; balance_paid no se usa en reservas divididas (balance_paid_on_split_booking responde invalid_state)
    severity: critical
    testLevel: unit
    ownerRole: domain-rules
