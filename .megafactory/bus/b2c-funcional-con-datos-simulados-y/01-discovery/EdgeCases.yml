  - id: EC-080
    storyRef: US-014
    category: state-machine
    given: la semilla de demo con una reserva por cada combinacion de bookingTabs (CONFIRMED y PENDING futura, IN_PAID en fase HOLD_GROUP, PARTIAL_PAID, PAYMENT_FAILED futura y pasada, IN_PAID pasada, EXPIRED_PAID futura y pasada, CONFIRMED y SETTLED con operational PENDING y fecha pasada, TOUR_COMPLETED, NO_ASSISTED, CANCELED, OPERATOR_CANCELLED, RESCHEDULED con su booking nuevo) y una semilla aparte con cada combinacion de bookingTabsUnreachable
    when: abro Mis reservas y ejecuto el validador de la semilla
    then: cada reserva aparece en exactamente una pestana segun bookingTabs evaluado en el orden de bookingTabsPrecedence; IN_PAID, PAYMENT_FAILED y EXPIRED_PAID pasadas van a Canceladas con la etiqueta Vencida; CONFIRMED y SETTLED pasadas sin cierre van a Completadas con la etiqueta En cierre y sin calificar; RESCHEDULED no aparece y no hay duplicado de la reprogramada; los contadores de cada pestana coinciden con su lista; el validador rechaza cada combinacion de bookingTabsUnreachable con su razon
    severity: high
    testLevel: unit
    ownerRole: frontend
  - id: EC-081
    storyRef: US-009
    category: split-fare
    given: un participante en SLOT_RELEASED y la fecha con 0 cupos o con 1 cupo
    when: el organizador pulsa Generar enlace nuevo para esa persona
    then: con 0 cupos se informa Cupo agotado (sold_out) y el participante sigue SLOT_RELEASED; con 1 cupo vuelve a PENDING_RESERVATION con un enlace nuevo y se aparta su cupo; si el booking estaba en PARTIAL_PAID pasa a IN_PAID por split_participant_reopened (fase HOLD_GROUP reabierta) conservando los pagos y la balance_due_date de los demas, y si estaba en EXPIRED_PAID pasa a IN_PAID por new_link_generated; cuando ese participante paga su reserva el booking vuelve a PARTIAL_PAID por split_all_reservations_paid con su propio payment_event_id; con el booking en CONFIRMED o despues de balance_due_date el boton no aparece y la funcion responde invalid_state o balance_due_date_passed
    severity: high
    testLevel: integration
    ownerRole: frontend
