  - id: EC-085
    storyRef: US-009
    category: idempotency
    given: una reserva dividida reabierta por split_participant_reopened (IN_PAID) cuyo participante nuevo paga la reserva y el webhook simulado llega dos veces con el mismo payment_event_id
    when: se procesan ambos eventos
    then: el participante pasa una sola vez a RESERVATION_PAID, el booking vuelve una sola vez a PARTIAL_PAID por split_all_reservations_paid y el segundo evento es idempotent_noop; el primer cierre de la fase HOLD_GROUP (con otro payment_event_id) no bloquea este segundo cierre
    severity: high
    testLevel: unit
    ownerRole: domain-rules
