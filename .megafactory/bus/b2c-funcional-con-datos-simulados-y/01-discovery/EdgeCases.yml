feature: b2c-funcional-con-datos-simulados-y
conventions:
  daysBeforeTour: diferencia de fechas calendario entre la fecha del tour y la fecha de hoy, ambas en America/Bogota; entero sin horas ni minutos (Spec-D RF-D08b, Domain-Financiero)
  balanceDueDate: fecha del tour menos full_payment_days_before del tour simulado; el saldo se puede pagar hasta el final de ese dia en America/Bogota y queda vencido desde el dia siguiente
  stateSource: nombres de estado de packages/contracts/src/enums/booking-status.ts y Maquina-Estados-Booking.md; el booking es multidimensional y no hay enum plano
  splitPhase: HOLD_GROUP no existe en PAYMENT_STATUS; es la fase derivada del grupo mientras algun participante vigente no ha pagado su porcentaje de reserva (Spec-C RF-C06)
  splitVigentes: participante vigente es el que esta en PENDING_RESERVATION, RESERVATION_PAID o BALANCE_PAID; SLOT_RELEASED y FORFEITED no cuentan en el total, en el saldo pendiente ni en los guards del grupo
  splitGroupRecalc: recalcular_fase_del_grupo evalua en este orden y dispara a lo sumo un evento del booking; todos los participantes SLOT_RELEASED sin pago dispara link_expired; IN_PAID con todos los vigentes con reserva pagada dispara split_all_reservations_paid; PARTIAL_PAID con todos los vigentes en BALANCE_PAID dispara split_all_balances_paid; PARTIAL_PAID sin vigentes y con algun FORFEITED dispara split_all_participants_forfeited en lifecycle; en otro caso no dispara nada
  bookingTabsPrecedence: las reglas de bookingTabs se evaluan en orden (oculta, canceladas, completadas, por-pagar, proximas) y la primera que cumple asigna la pestana; asi cada reserva cae en una sola
stateMachines:
  - id: booking-payment
    entity: booking.payment_status
    states: [IN_PAID, PARTIAL_PAID, CONFIRMED, SETTLED, EXPIRED_PAID, PAYMENT_FAILED, CHARGEBACK]
    initial: IN_PAID
    terminal: [CHARGEBACK]
    transitions:
      - from: IN_PAID
        to: CONFIRMED
        event: payment_approved_full
        guard: payment_event_id no procesado, link activo unico y cupo apartado vigente
        sideEffects: [descontar_cupo, crear_notificacion, toast_reserva_confirmada]
        idempotencyKey: payment_event_id
      - from: IN_PAID
        to: PARTIAL_PAID
        event: payment_approved_deposit
        guard: el tour admite abono, daysBeforeTour mayor a full_payment_days_before y payment_event_id no procesado
        sideEffects: [descontar_cupo, fijar_balance_due_date, crear_notificacion]
        idempotencyKey: payment_event_id
      - from: IN_PAID
        to: PARTIAL_PAID
        event: split_all_reservations_paid
        guard: reserva Divide tu cuenta y todos los participantes vigentes (PENDING_RESERVATION, RESERVATION_PAID o BALANCE_PAID; sin contar SLOT_RELEASED ni FORFEITED) pagaron su porcentaje de reserva
        sideEffects: [cerrar_fase_hold_group, fijar_balance_due_date_por_participante, crear_notificacion]
        idempotencyKey: id del evento que cierra la fase (payment_event_id del ultimo pago de reserva o participant_link_id del enlace que vencio)
      - from: IN_PAID
        to: EXPIRED_PAID
        event: link_expired
        guard: link vencido sin pago aprobado (15 minutos en pago individual, vigencia del enlace en Divide tu cuenta con todos los participantes sin pagar)
        sideEffects: [liberar_cupo, crear_notificacion]
        idempotencyKey: booking_reference
      - from: IN_PAID
        to: PAYMENT_FAILED
        event: payment_declined
        guard: escenario demo rechazado y payment_event_id no procesado
        sideEffects: [crear_notificacion]
        idempotencyKey: payment_event_id
      - from: PAYMENT_FAILED
        to: IN_PAID
        event: retry_new_attempt
        guard: cupo apartado vigente o revalidado con disponibilidad
        sideEffects: [generar_link_nuevo, recalcular_costo_metodo]
        idempotencyKey: attempt_id
      - from: EXPIRED_PAID
        to: IN_PAID
        event: new_link_generated
        guard: daysBeforeTour mayor o igual a 0 y hay cupo en la fecha
        sideEffects: [apartar_cupo, generar_link_nuevo]
        idempotencyKey: attempt_id
      - from: PARTIAL_PAID
        to: CONFIRMED
        event: balance_paid
        guard: reserva individual (no Divide tu cuenta), saldo pendiente igual a cero y hoy no posterior a balance_due_date
        sideEffects: [crear_notificacion]
        idempotencyKey: payment_event_id
      - from: PARTIAL_PAID
        to: IN_PAID
        event: split_participant_reopened
        guard: reserva Divide tu cuenta, un participante paso de SLOT_RELEASED a PENDING_RESERVATION por participant_new_link y hoy no posterior a balance_due_date
        sideEffects: [reabrir_fase_hold_group, conservar_pagos_y_balance_due_date_de_los_demas, crear_notificacion]
        idempotencyKey: participant_link_id
      - from: PARTIAL_PAID
        to: CONFIRMED
        event: split_all_balances_paid
        guard: reserva Divide tu cuenta, al menos un participante vigente y todos los vigentes en BALANCE_PAID; el saldo pendiente solo suma a los vigentes y excluye a FORFEITED y SLOT_RELEASED
        sideEffects: [habilitar_voucher, crear_notificacion]
        idempotencyKey: booking_reference
      - from: CONFIRMED
        to: SETTLED
        event: simulated_disbursement
        guard: solo datos semilla de la demo; el B2C nunca dispara la dispersion
        sideEffects: []
        idempotencyKey: booking_reference
    invalidTransitions:
      - from: CONFIRMED
        event: payment_approved_full
        expectedError: idempotent_noop
      - from: CONFIRMED
        event: payment_declined
        expectedError: idempotent_noop
      - from: PARTIAL_PAID
        event: payment_approved_deposit
        expectedError: idempotent_noop
      - from: PARTIAL_PAID
        event: balance_paid_after_due_date
        expectedError: balance_due_date_passed
      - from: EXPIRED_PAID
        event: payment_approved_full
        expectedError: requires_new_attempt
      - from: EXPIRED_PAID
        event: new_link_generated_without_slot
        expectedError: sold_out
      - from: SETTLED
        event: balance_paid
        expectedError: idempotent_noop
      - from: IN_PAID
        event: balance_paid
        expectedError: invalid_state
      - from: PARTIAL_PAID
        event: balance_paid_on_split_booking
        expectedError: invalid_state
      - from: PARTIAL_PAID
        event: split_all_balances_paid_with_pending_balance
        expectedError: invalid_state
      - from: PARTIAL_PAID
        event: split_participant_reopened_after_balance_due_date
        expectedError: balance_due_date_passed
      - from: IN_PAID
        event: split_all_balances_paid
        expectedError: invalid_state
      - from: CONFIRMED
        event: split_participant_reopened
        expectedError: invalid_state
      - from: CONFIRMED
        event: split_all_balances_paid
        expectedError: idempotent_noop
  - id: booking-lifecycle
    entity: booking.lifecycle_status
    states: [ACTIVE, CANCELED, OPERATOR_CANCELLED, RESCHEDULED]
    initial: ACTIVE
    terminal: [CANCELED, OPERATOR_CANCELLED, RESCHEDULED]
    transitions:
      - from: ACTIVE
        to: CANCELED
        event: cancel_confirmed
        guard: OTP valido, daysBeforeTour mayor o igual a 5, payment_status en PARTIAL_PAID, CONFIRMED o SETTLED y operational_status PENDING
        sideEffects: [calcular_penalidad_sobre_lo_pagado, abonar_saldo_a_favor, liberar_cupo, operational_a_cancelled, crear_notificacion]
        idempotencyKey: cancellation_request_id
      - from: ACTIVE
        to: CANCELED
        event: balance_due_date_passed
        guard: reserva individual (no Divide tu cuenta), payment_status PARTIAL_PAID, saldo pendiente mayor a cero y hoy posterior a balance_due_date
        sideEffects: [penalized_true, retener_abono_como_penalidad, saldo_a_favor_cero, liberar_cupo, operational_a_cancelled, crear_notificacion]
        idempotencyKey: booking_reference
      - from: ACTIVE
        to: CANCELED
        event: split_all_participants_forfeited
        guard: reserva Divide tu cuenta en PARTIAL_PAID, ningun participante en BALANCE_PAID ni en RESERVATION_PAID y al menos uno en FORFEITED (los demas SLOT_RELEASED)
        sideEffects: [penalized_true, retener_cuotas_de_reserva_no_reembolsables, saldo_a_favor_cero, liberar_cupo, operational_a_cancelled, crear_notificacion]
        idempotencyKey: booking_reference
      - from: ACTIVE
        to: RESCHEDULED
        event: reschedule_applied
        guard: reschedule_count menor a 2, daysBeforeTour mayor o igual a 5, payment_status en PARTIAL_PAID, CONFIRMED o SETTLED, cupo en la nueva fecha y diferencia pagada o igual a cero
        sideEffects: [crear_booking_nuevo_que_hereda_payment_status, reschedule_count_mas_uno_en_el_nuevo, mover_cupo, operational_congelado, crear_notificacion]
        idempotencyKey: reschedule_request_id
      - from: ACTIVE
        to: OPERATOR_CANCELLED
        event: operator_cancel_seeded
        guard: solo datos semilla de la demo; el B2C no dispara la cancelacion del operador
        sideEffects: [habilitar_solicitud_de_reembolso, operational_a_cancelled]
        idempotencyKey: booking_reference
    invalidTransitions:
      - from: CANCELED
        event: cancel_confirmed
        expectedError: idempotent_noop
      - from: CANCELED
        event: reschedule_applied
        expectedError: invalid_state
      - from: RESCHEDULED
        event: reschedule_applied
        expectedError: invalid_state
      - from: RESCHEDULED
        event: cancel_confirmed
        expectedError: invalid_state
      - from: OPERATOR_CANCELLED
        event: cancel_confirmed
        expectedError: invalid_state
      - from: ACTIVE
        event: reschedule_applied_with_count_2
        expectedError: max_reschedules_reached
      - from: ACTIVE
        event: cancel_confirmed_under_5_days
        expectedError: too_close_to_tour
  - id: booking-operational
    entity: booking.operational_status
    states: [PENDING, ASSISTED, NO_ASSISTED, IN_TOUR, TOUR_COMPLETED, TOUR_CANCELLED_ONSITE, CANCELLED]
    initial: PENDING
    terminal: [NO_ASSISTED, TOUR_COMPLETED, TOUR_CANCELLED_ONSITE, CANCELLED]
    transitions:
      - from: PENDING
        to: TOUR_COMPLETED
        event: tour_completed_seeded
        guard: payment_status en CONFIRMED o SETTLED, lifecycle ACTIVE y fecha del tour anterior a hoy en America/Bogota
        sideEffects: [habilitar_calificacion, sumar_km_mis_tours]
        idempotencyKey: booking_reference
      - from: PENDING
        to: NO_ASSISTED
        event: no_show_seeded
        guard: payment_status en CONFIRMED o SETTLED y fecha del tour anterior a hoy
        sideEffects: [penalized_true, sin_saldo_a_favor]
        idempotencyKey: booking_reference
      - from: PENDING
        to: CANCELLED
        event: lifecycle_closed
        guard: lifecycle pasa a CANCELED u OPERATOR_CANCELLED
        sideEffects: []
        idempotencyKey: booking_reference
    invalidTransitions:
      - from: PENDING
        event: tour_completed_seeded_unpaid
        expectedError: invalid_state
      - from: CANCELLED
        event: tour_completed_seeded
        expectedError: invalid_state
      - from: TOUR_COMPLETED
        event: no_show_seeded
        expectedError: invalid_state
  - id: split-participant
    entity: split_participant
    states: [PENDING_RESERVATION, RESERVATION_PAID, BALANCE_PAID, SLOT_RELEASED, FORFEITED]
    initial: PENDING_RESERVATION
    terminal: [BALANCE_PAID, FORFEITED]
    notes: SLOT_RELEASED no es terminal porque admite participant_new_link mientras el booking este en IN_PAID o PARTIAL_PAID y antes de balance_due_date; si el booking llega a CONFIRMED, CANCELED o EXPIRED_PAID con fecha pasada, el participante queda en SLOT_RELEASED sin salidas validas
    transitions:
      - from: PENDING_RESERVATION
        to: RESERVATION_PAID
        event: participant_reservation_paid
        guard: enlace del participante vigente y payment_event_id no procesado
        sideEffects: [recalcular_fase_del_grupo, crear_notificacion]
        idempotencyKey: payment_event_id
      - from: PENDING_RESERVATION
        to: SLOT_RELEASED
        event: participant_link_expired
        guard: vigencia del enlace del participante vencida sin pago
        sideEffects: [liberar_solo_su_cupo, recalcular_total_para_vigentes, recalcular_fase_del_grupo, crear_notificacion]
        idempotencyKey: participant_link_id
      - from: SLOT_RELEASED
        to: PENDING_RESERVATION
        event: participant_new_link
        guard: booking en IN_PAID, PARTIAL_PAID o EXPIRED_PAID, lifecycle ACTIVE, hay cupo en la fecha y daysBeforeTour mayor a full_payment_days_before
        sideEffects: [apartar_su_cupo, generar_enlace_nuevo, disparar_split_participant_reopened_si_partial_paid, disparar_new_link_generated_si_expired_paid]
        idempotencyKey: participant_link_id
      - from: RESERVATION_PAID
        to: BALANCE_PAID
        event: participant_balance_paid
        guard: saldo individual igual a cero antes del plazo del saldo
        sideEffects: [recalcular_fase_del_grupo, crear_notificacion]
        idempotencyKey: payment_event_id
      - from: RESERVATION_PAID
        to: FORFEITED
        event: participant_balance_deadline_passed
        guard: saldo individual mayor a cero al vencer el plazo del saldo (Spec-C RF-C06b)
        sideEffects: [cancelar_solo_su_cupo, retener_cuota_de_reserva_no_reembolsable, saldo_a_favor_cero, recalcular_fase_del_grupo, crear_notificacion]
        idempotencyKey: participant_link_id
    invalidTransitions:
      - from: RESERVATION_PAID
        event: participant_reservation_paid
        expectedError: idempotent_noop
      - from: SLOT_RELEASED
        event: participant_reservation_paid
        expectedError: requires_new_attempt
      - from: SLOT_RELEASED
        event: participant_new_link_without_slot
        expectedError: sold_out
      - from: SLOT_RELEASED
        event: participant_new_link_after_balance_due_date
        expectedError: balance_due_date_passed
      - from: SLOT_RELEASED
        event: participant_new_link_on_confirmed_booking
        expectedError: invalid_state
      - from: FORFEITED
        event: participant_new_link
        expectedError: invalid_state
      - from: FORFEITED
        event: participant_balance_paid
        expectedError: invalid_state
      - from: BALANCE_PAID
        event: participant_balance_paid
        expectedError: idempotent_noop
  - id: reschedule-request
    entity: reschedule_request
    states: [PENDING_DIFFERENCE, APPLIED, EXPIRED]
    initial: PENDING_DIFFERENCE
    terminal: [APPLIED, EXPIRED]
    transitions:
      - from: PENDING_DIFFERENCE
        to: APPLIED
        event: difference_paid_or_zero
        guard: diferencia igual a cero o pago simulado aprobado dentro de 48 horas y cupo vigente en la nueva fecha
        sideEffects: [disparar_reschedule_applied_en_lifecycle]
        idempotencyKey: reschedule_request_id
      - from: PENDING_DIFFERENCE
        to: EXPIRED
        event: difference_window_48h_passed
        guard: 48 horas desde la solicitud sin pago de la diferencia (Spec-D RF-D08b)
        sideEffects: [booking_original_conserva_fecha, reschedule_count_sin_cambio, liberar_cupo_nueva_fecha, crear_notificacion]
        idempotencyKey: reschedule_request_id
    invalidTransitions:
      - from: EXPIRED
        event: difference_paid_or_zero
        expectedError: requires_new_attempt
      - from: APPLIED
        event: difference_paid_or_zero
        expectedError: idempotent_noop
  - id: payment-attempt
    entity: payment_attempt
    states: [CREATED, PROCESSING, APPROVED, REJECTED, LINK_EXPIRED, SOLD_OUT]
    initial: CREATED
    terminal: [APPROVED, REJECTED, LINK_EXPIRED, SOLD_OUT]
    transitions:
      - from: CREATED
        to: PROCESSING
        event: pay_clicked
        guard: sesion activa, pasaporte cargado si no residente, metodo elegido
        sideEffects: [bloquear_boton_pagar]
        idempotencyKey: attempt_id
      - from: PROCESSING
        to: APPROVED
        event: simulated_webhook_approved
        guard: payment_event_id no procesado
        sideEffects: [payment_status_a_confirmed_o_partial_paid]
        idempotencyKey: payment_event_id
      - from: PROCESSING
        to: REJECTED
        event: simulated_webhook_rejected
        guard: escenario demo rechazado
        sideEffects: [payment_status_a_payment_failed, crear_notificacion]
        idempotencyKey: payment_event_id
      - from: PROCESSING
        to: LINK_EXPIRED
        event: simulated_link_expired
        guard: escenario demo enlace vencido
        sideEffects: [payment_status_a_expired_paid, crear_notificacion]
        idempotencyKey: payment_event_id
      - from: PROCESSING
        to: SOLD_OUT
        event: simulated_sold_out
        guard: cupo de la fecha igual a cero
        sideEffects: [payment_status_a_expired_paid, ofrecer_lista_de_espera, crear_notificacion]
        idempotencyKey: payment_event_id
    invalidTransitions:
      - from: APPROVED
        event: simulated_webhook_approved
        expectedError: idempotent_noop
      - from: REJECTED
        event: simulated_webhook_approved
        expectedError: requires_new_attempt
      - from: LINK_EXPIRED
        event: pay_clicked
        expectedError: requires_new_attempt
  - id: refund-request
    entity: refund_request
    states: [PENDING_REVIEW, APPROVED, REJECTED, IN_PROCESS, COMPLETED]
    initial: PENDING_REVIEW
    terminal: [REJECTED, COMPLETED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        event: erp_review_seeded
        guard: solo datos semilla; la revision la hace COORD o SUPER_ADMIN en el ERP, fuera de alcance
        sideEffects: []
        idempotencyKey: refund_request_id
      - from: PENDING_REVIEW
        to: REJECTED
        event: erp_review_seeded
        guard: solo datos semilla
        sideEffects: []
        idempotencyKey: refund_request_id
    invalidTransitions:
      - from: PENDING_REVIEW
        event: refund_submitted
        expectedError: idempotent_noop
bookingTabs:
  - tab: oculta
    order: 1
    rule: lifecycle RESCHEDULED (la reemplaza el booking nuevo) o payment_status CHARGEBACK (no existe en la semilla del B2C)
  - tab: canceladas
    order: 2
    rule: lifecycle CANCELED u OPERATOR_CANCELLED (etiqueta Cancelada); o lifecycle ACTIVE con payment_status IN_PAID, PAYMENT_FAILED o EXPIRED_PAID y daysBeforeTour menor a 0 (etiqueta Vencida, sin voucher ni boton Pagar)
  - tab: completadas
    order: 3
    rule: operational TOUR_COMPLETED (con calificacion) o NO_ASSISTED (etiqueta No asististe, sin calificar); o lifecycle ACTIVE con payment_status CONFIRMED o SETTLED, operational PENDING, ASSISTED o IN_TOUR y daysBeforeTour menor a 0 (etiqueta En cierre, sin calificar hasta TOUR_COMPLETED)
  - tab: por-pagar
    order: 4
    rule: lifecycle ACTIVE, payment_status IN_PAID (incluye la fase HOLD_GROUP), PARTIAL_PAID, PAYMENT_FAILED o EXPIRED_PAID y daysBeforeTour mayor o igual a 0
  - tab: proximas
    order: 5
    rule: lifecycle ACTIVE, payment_status CONFIRMED o SETTLED, operational PENDING, ASSISTED o IN_TOUR y daysBeforeTour mayor o igual a 0
bookingTabsUnreachable:
  - combination: lifecycle ACTIVE, payment_status PARTIAL_PAID y daysBeforeTour menor a 0
    reason: balance_due_date es anterior a la fecha del tour; antes de llegar a la fecha la reserva individual pasa a CANCELED por balance_due_date_passed y la dividida a CONFIRMED o CANCELED por recalcular_fase_del_grupo; el validador de la semilla la rechaza
  - combination: operational TOUR_CANCELLED_ONSITE
    reason: ninguna transicion de booking-operational lo alcanza en el B2C y la semilla no lo usa; el validador de la semilla lo rechaza
  - combination: operational TOUR_COMPLETED o NO_ASSISTED con payment_status distinto de CONFIRMED o SETTLED
    reason: los guards de tour_completed_seeded y no_show_seeded exigen CONFIRMED o SETTLED; el validador de la semilla la rechaza
openQuestions:
  - id: OQ-EC-01
    blocking: false
    owner: product-manager
    question: steering 05 resume Split Fare como HOLD_GROUP hasta 100 por ciento pagado y Spec-C RF-C06 define responsabilidad individual; se adopta Spec-C (igual que prd@v2 y la revision R1-02). Confirmar que el steering 05 se lee como todos los participantes vigentes pagaron su porcentaje de reserva
  - id: OQ-EC-02
    blocking: false
    owner: domain-rules
    question: Spec-C seccion 8 nombra los estados del grupo HOLD_GROUP, PARTIAL_PAID, CONFIRMED y SETTLED con otro significado que packages/contracts (alli SETTLED es la dispersion). Se mapea a contracts con la fase HOLD_GROUP sobre IN_PAID, todas las reservas pagadas a PARTIAL_PAID y todos los saldos pagados a CONFIRMED; la pantalla muestra la etiqueta Reserva confirmada con saldo pendiente
  - id: OQ-EC-03
    blocking: false
    owner: product-manager
    question: Maquina-Estados-Booking seccion 7 dice que el booking nuevo nace en PARTIAL_PAID hasta pagar la diferencia; Spec-D RF-D08b y AC-017-5 dicen que sin pago en 48 horas se cancela la solicitud y se conserva la fecha original. Se adopta el modelo de solicitud (reschedule-request) y el booking nuevo solo se crea al aplicar
  - id: OQ-EC-04
    blocking: false
    owner: product-manager
    question: No Show (NO_ASSISTED) se ubica en Completadas con la etiqueta No asististe; confirmar si debe ir en Canceladas
edgeCases:
  - id: EC-001
    storyRef: US-002
    category: concurrency
    given: una fecha con 1 cupo restante abierta en dos pestanas del mismo navegador
    when: ambas pestanas pulsan Reservar ahora y pagan con exito una tras otra
    then: solo la primera reserva queda en CONFIRMED; la segunda termina en el estado Cupo agotado (intento SOLD_OUT, payment_status EXPIRED_PAID) y no se crea sobreventa en la disponibilidad simulada
    severity: critical
    testLevel: integration
    ownerRole: frontend
  - id: EC-002
    storyRef: US-002
    category: concurrency
    given: el selector de viajeros con cupos restantes igual a 3
    when: pulso + rapidamente 6 veces o mantengo pulsado
    then: el total de viajeros no supera 3, el boton + queda deshabilitado con aria-disabled y se anuncia el limite
    severity: high
    testLevel: e2e
    ownerRole: frontend
  - id: EC-003
    storyRef: US-004
    category: concurrency
    given: el carrito guardado con 4 viajeros y una fecha cuyo cupo bajo a 2 mientras el usuario estaba en el paso 2
    when: vuelve al paso 1 o pulsa Pagar
    then: se revalida la disponibilidad, se avisa que solo quedan 2 cupos y no se permite pagar con 4 viajeros
    severity: high
    testLevel: integration
    ownerRole: frontend
  - id: EC-004
    storyRef: US-007
    category: idempotency
    given: un pago simulado aprobado con payment_event_id ya procesado
    when: el adaptador simulado entrega de nuevo el mismo evento, o el usuario recarga /checkout/procesando o pulsa Atras y vuelve
    then: no se crea una segunda reserva ni se descuenta otro cupo; la confirmacion muestra la misma referencia BT-AAAA-NNNNN
    severity: critical
    testLevel: integration
    ownerRole: frontend
  - id: EC-005
    storyRef: US-006
    category: idempotency
    given: el paso 3 con el boton Pagar habilitado
    when: hago doble clic o pulso Enter dos veces seguidas
    then: se crea un solo intento de pago; el boton queda deshabilitado con aria-busy mientras procesa
    severity: critical
    testLevel: e2e
    ownerRole: frontend
  - id: EC-006
    storyRef: US-013
    category: idempotency
    given: la bateria de contrato de la capa de datos
    when: se ejecuta sobre la implementacion simulada con eventos de pago repetidos y desordenados (payment_declined despues de payment_approved_full, o payment_approved_deposit repetido)
    then: payment_status queda en el del primer evento terminal valido (CONFIRMED o PARTIAL_PAID) y los eventos posteriores son no-op registrados (idempotent_noop); la misma bateria queda lista para la API /api/v1
    severity: critical
    testLevel: unit
    ownerRole: frontend
  - id: EC-007
    storyRef: US-008
    category: timeout
