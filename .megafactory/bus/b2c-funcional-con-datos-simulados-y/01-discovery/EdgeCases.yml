    when: vence el plazo del saldo de ambos
    then: los 2 pasan a FORFEITED con su cuota de reserva no reembolsable; como no queda ningun vigente, lifecycle pasa a CANCELED por split_all_participants_forfeited con penalized true, sin Saldo a favor, se libera el cupo y la reserva aparece en Canceladas; split_all_balances_paid no se dispara
