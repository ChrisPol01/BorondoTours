<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#103B66"/>
      <stop offset="60%" style="stop-color:#2364AA"/>
      <stop offset="100%" style="stop-color:#00B7C7"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a2e"/>
      <stop offset="100%" style="stop-color:#79C142"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Mountains -->
  <polygon points="0,700 400,350 800,600 1200,300 1600,500 1920,400 1920,1080 0,1080" fill="url(#mountain)" opacity="0.8"/>
  <polygon points="0,800 300,550 700,700 1100,450 1500,650 1920,550 1920,1080 0,1080" fill="#1a5c3a" opacity="0.6"/>
  <!-- Foreground -->
  <rect y="900" width="1920" height="180" fill="#0d2e1a" opacity="0.4"/>
</svg>
