<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Borondo Tours · Logo Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1A1E1C; overflow: hidden; font-family: "Instrument Sans", sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #F7F4EC; }

  /* Fog atmosphere */
  .fog { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, rgba(62,69,64,0.8) 0%, transparent 60%); opacity: 0; animation: fogIn 1.2s ease-out 0.3s forwards; }
  @keyframes fogIn { to { opacity: 1; } }

  .wordmark { display: flex; align-items: center; gap: 18px; font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 120px; letter-spacing: -4px; line-height: 1; color: #F7F4EC; }
  .wordmark .letter { display: inline-block; opacity: 0; transform: translateY(40px); animation: letterIn 0.6s cubic-bezier(.2,.9,.3,1) forwards; }
  @keyframes letterIn { to { opacity: 1; transform: translateY(0); } }

  .bird-wrap { display: inline-block; width: 108px; height: 108px; opacity: 0; transform: scale(0.4); animation: birdIn 1.2s cubic-bezier(.2,.9,.3,1) 1.8s forwards; position: relative; margin: 0 2px; }
  @keyframes birdIn { to { opacity: 1; transform: scale(1); } }
  .beard-glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 70%, rgba(0,184,138,0.6) 0%, transparent 50%); filter: blur(20px); opacity: 0; animation: glow 2s ease-out 2.5s forwards; }
  @keyframes glow { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0.6; } }

  .tagline { margin-top: 40px; font-family: 'Fraunces', serif; font-style: italic; font-size: 24px; color: rgba(247,244,236,0.7); letter-spacing: -0.3px; opacity: 0; transform: translateY(20px); animation: letterIn 0.8s ease-out 3.2s forwards; }
  .meta { margin-top: 80px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: rgba(247,244,236,0.4); opacity: 0; animation: letterIn 0.6s ease-out 3.8s forwards; }

  /* Replay button */
  .replay { position: fixed; bottom: 32px; right: 32px; padding: 10px 18px; background: rgba(247,244,236,0.08); backdrop-filter: blur(12px); border: 1px solid rgba(247,244,236,0.2); color: #F7F4EC; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; opacity: 0; animation: letterIn 0.6s ease-out 4.2s forwards; }
  .replay:hover { background: rgba(0,184,138,0.3); border-color: rgba(0,184,138,0.5); }

  /* Links */
  .nav-links { position: fixed; top: 32px; left: 32px; display: flex; gap: 20px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: 0; animation: letterIn 0.6s ease-out 4.5s forwards; }
  .nav-links a { color: rgba(247,244,236,0.5); text-decoration: none; }
  .nav-links a:hover { color: #2DE5A8; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="fog"></div>

  <div class="wordmark">
    <span>
      <span class="letter" style="animation-delay: 0.2s">B</span>
      <span class="letter" style="animation-delay: 0.3s">o</span>
      <span class="letter" style="animation-delay: 0.4s">r</span>
      <span class="letter" style="animation-delay: 0.5s">o</span>
      <span class="letter" style="animation-delay: 0.6s">n</span>
      <span class="letter" style="animation-delay: 0.7s">d</span>
      <span class="letter" style="animation-delay: 0.8s">o</span>
    </span>
    <span>
      <span class="letter" style="animation-delay: 1.0s">T</span>
      <span class="bird-wrap">
        <div class="beard-glow"></div>
        <svg width="108" height="108" viewBox="0 0 80 80" fill="none">
          <circle cx="40" cy="40" r="37" stroke="#F7F4EC" stroke-width="5" fill="none" />
          <defs><clipPath id="o-clip-r"><circle cx="40" cy="40" r="34" /></clipPath></defs>
          <g clip-path="url(#o-clip-r)">
            <g fill="#F7F4EC">
              <path d="M 20 24 L 18 4 L 26 24 Z" /><path d="M 28 20 L 28 2 L 34 20 Z" />
              <path d="M 46 20 L 52 2 L 52 20 Z" /><path d="M 54 24 L 62 4 L 60 24 Z" />
              <path d="M 36 18 L 38 0 L 42 18 Z" /><path d="M 42 18 L 46 0 L 46 18 Z" />
            </g>
            <ellipse cx="40" cy="36" rx="20" ry="18" fill="#F7F4EC" />
            <path d="M 30 32 Q 40 28 50 32 L 52 44 Q 40 48 28 44 Z" fill="#1A1E1C" />
            <path d="M 37 30 Q 40 28 43 30 L 43 48 Q 40 50 37 48 Z" fill="#F7F4EC" />
            <circle cx="34" cy="38" r="1.8" fill="#1A1E1C" /><circle cx="46" cy="38" r="1.8" fill="#1A1E1C" />
            <path d="M 38 48 L 40 54 L 42 48 Z" fill="#F7F4EC" />
            <g fill="#2DE5A8"><path d="M 35 52 Q 34 66 38 78 Q 39 68 39 56 Z" /><path d="M 39 54 Q 39 70 40 80 Q 41 70 41 56 Z" /><path d="M 43 54 Q 44 68 42 78 Q 41 70 41 56 Z" /></g>
          </g>
        </svg>
      </span>
      <span class="letter" style="animation-delay: 1.3s">u</span>
      <span class="letter" style="animation-delay: 1.4s">r</span>
      <span class="letter" style="animation-delay: 1.5s">s</span>
    </span>
  </div>

  <div class="tagline">Wander Colombia, freely.</div>
  <div class="meta">Páramo · Selva · Costa · Cafetal</div>

  <div class="nav-links">
    <a href="Brand Guidelines.html">← Brand</a>
    <a href="Landing.html">Landing →</a>
    <a href="Mobile.html">Mobile →</a>
  </div>

  <button class="replay" onclick="location.reload()">↻ Replay</button>
</div>
</body>
</html>
